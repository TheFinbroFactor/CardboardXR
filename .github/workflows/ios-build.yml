
name: Build CardboardXR for iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity iOS project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CARDBOARDXR_BUNDLE_ID: com.thefinbrofactor.cardboardxr
        with:
          targetPlatform: iOS
          unityVersion: 6000.6.0f1
          buildMethod: ProjectBootstrap.StereoBuilder.BuildIos
          cacheUnityInstallationOnMac: true

      - name: Compile iPhone application
        run: |
          xcodebuild \
            -project Builds/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Builds/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R Builds/DerivedData/Build/Products/Release-iphoneos/Unity-iPhone.app ipa/Payload/
          cd ipa
          zip -r ../CardboardXR.ipa Payload

      - name: Upload iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-iPhone
          path: CardboardXR.ipa
